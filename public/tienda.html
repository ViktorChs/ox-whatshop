<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WhatShop</title>
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="description" content="WhatShop - Tienda online con checkout por WhatsApp" />
  <meta property="og:title" content="WhatShop" />
  <meta property="og:description" content="Tienda online con checkout por WhatsApp" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="./assets/logos/logoB.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/theme.css?v=6" />
  <link rel="stylesheet" href="./css/tienda.css?v=6" />
</head>
<body class="shop-page">

  <div id="shop-splash">
    <img id="splash-logo" class="splash-logo" src="./assets/logos/logoB.png" alt="" />
    <h1 class="splash-title" aria-label="WhatShop"><span id="splash-what" class="what">What</span><span id="splash-shop" class="shop">Shop</span></h1>
    <div class="splash-spinner" role="status" aria-label="Cargando"></div>
  </div>

  <div id="welcome-screen" class="hidden">
    <div class="welcome-inner">
      <img id="welcome-logo" class="welcome-logo" src="./assets/logos/logoB.png" alt="" />
      <p id="welcome-text" class="welcome-text">Bienvenido</p>
      <button id="welcome-btn" class="liq-btn" aria-label="Entrar a la tienda">
        <span class="liq-label" data-i18n="enter_store">Entrar a la tienda</span>
      </button>
    </div>
  </div>

  <header class="top-header">
    <div class="top-header-inner">
      <div class="brand">
        <img id="brand-logo" src="./assets/logos/logoB.png" alt="Logo" />
        <h1 id="brand-name">WhatShop</h1>
      </div>

      <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="search-input" data-i18n-ph="buscar" placeholder="Buscar productos..." aria-label="Buscar productos" />
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="lang-toggle" aria-label="Cambiar idioma" title="Idioma">
          <span id="lang-label" style="font-weight:700;font-size:0.9rem">ES</span>
        </button>
        <button class="icon-btn" id="theme-toggle" aria-label="Cambiar modo claro/oscuro" title="Modo claro/oscuro">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>

        <nav class="top-nav" aria-label="Navegación principal">
          <button class="nav-item active" data-tab="home" aria-label="Inicio" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span data-i18n="nav_home">Inicio</span>
          </button>
          <button class="nav-item" data-tab="explore" aria-label="Explorar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span data-i18n="nav_explore">Explorar</span>
          </button>
          <button class="nav-item" data-tab="cart" aria-label="Carrito">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <span data-i18n="nav_cart">Carrito <span id="cart-badge" class="cart-badge hidden">0</span></span>
          </button>
        </nav>
      </div>
    </div>
  </header>

  <main class="shop-inner">
    <div id="store-notice" class="store-notice hidden"></div>

    <section class="promo-banner" aria-label="Oferta">
      <div class="promo-copy">
        <div class="promo-title" data-i18n="promo_title">Rebajas de Año Nuevo</div>
        <div class="promo-discount" data-i18n="promo_discount">25% descuento</div>
      </div>
      <div class="placeholder-box promo-visual" role="img" data-i18n-aria="promo_img"></div>
    </section>

    <section class="section-block" aria-label="Categorías">
      <div class="section-head">
        <h2 data-i18n="categories_title">Categorías</h2>
      </div>
      <div class="category-row" id="category-row"></div>
    </section>

    <section class="section-block" id="home-view" aria-label="Productos populares">
      <div class="section-head">
        <h2 data-i18n="popular_title">Productos Populares</h2>
      </div>
      <div class="products-grid" id="products-grid"></div>
    </section>

    <section class="section-block hidden" id="explore-view" aria-label="Explorar">
      <div class="section-head">
        <h2 data-i18n="nav_explore">Explorar</h2>
      </div>
      <div class="explore-filters" id="explore-filters"></div>
      <div class="products-grid" id="explore-grid"></div>
    </section>
  </main>

  <div class="cart-scrim" id="cart-scrim"></div>
  <aside class="cart-drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-label="Carrito">
    <div class="cart-head">
      <h3 data-i18n="cart_title">Carrito</h3>
      <button class="cart-close" id="cart-close" aria-label="Cerrar carrito">&times;</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-foot">
      <div class="cart-total-row"><span data-i18n="cart_total">Total</span><span class="amount" id="cart-total">$0.00</span></div>
      <button class="btn-checkout" id="go-checkout">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 7h-4V5a4 4 0 0 0-8 0v2H4a1 1 0 0 0-1 1v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a1 1 0 0 0-1-1ZM10 5a2 2 0 0 1 4 0v2h-4Z"/></svg>
        <span data-i18n="cart_checkout">Proceder al checkout</span>
      </button>
    </div>
  </aside>

  <footer class="shop-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <img src="./assets/logos/logoB.png" alt="Logo WhatShop" />
        <span><span class="what">What</span><span class="shop">Shop</span></span>
      </div>
      <div class="footer-links">
        <a href="./terminos.html" data-i18n="f_terminos">Términos y condiciones</a>
        <a href="./privacidad.html" data-i18n="f_privacidad">Política de privacidad</a>
        <a href="./politicas.html" data-i18n="f_politicas">Políticas de compra</a>
        <a href="./cookies.html" data-i18n="f_cookies">Política de cookies</a>
        <a href="./contacto.html" data-i18n="f_contacto">Contacto</a>
      </div>
      <div class="footer-copy">
        <span>&copy; <span id="footer-year"></span> <span id="footer-brand-name">WhatShop</span> · <span data-i18n="f_by">Plataforma de tienda de</span> OX1</span>
      </div>
    </div>
  </footer>

  <nav class="bottom-nav" aria-label="Navegación">
    <button class="nav-item active" data-tab="home" aria-label="Inicio" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span data-i18n="nav_home">Inicio</span>
    </button>
    <button class="nav-item" data-tab="explore" aria-label="Explorar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span data-i18n="nav_explore">Explorar</span>
    </button>
    <button class="nav-item" data-tab="cart" aria-label="Carrito">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span data-i18n="nav_cart">Carrito <span id="cart-badge-m" class="cart-badge hidden">0</span></span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status"></div>

  <script src="./config.js?v=6"></script>
  <script src="./js/supabase.js?v=6"></script>
  <script src="./js/cart.js?v=6"></script>
  <script>
    // ===== i18n =====
    var I18N = {
      es: {
        nav_home: 'Inicio', nav_explore: 'Explorar', nav_cart: 'Carrito',
        buscar: 'Buscar productos...',
        promo_title: 'Rebajas de Año Nuevo', promo_discount: '25% descuento', promo_img: 'Imagen de promoción',
        categories_title: 'Categorías', popular_title: 'Productos Populares',
        cart_title: 'Carrito', cart_total: 'Total', cart_checkout: 'Proceder al checkout',
        checkout_title: 'Datos de envío y pago', co_name: 'Nombre completo', co_name_ph: 'Tu nombre',
        co_phone: 'Teléfono / WhatsApp', co_payment: 'Método de pago', co_payment_sel: 'Selecciona...',
        pay_cash: 'Efectivo', pay_transfer: 'Transferencia', pay_mobile: 'Pago móvil', pay_card: 'Tarjeta',
        co_note: 'Nota / referencia (opcional)', co_note_ph: 'Dirección, referencia, talla...',
        send_whatsapp: 'Enviar pedido por WhatsApp',
        cart_empty: 'Tu carrito está vacío', no_products: 'No hay productos', write_name: 'Escribe tu nombre',
        add_to_cart: 'Agregar al carrito', view: 'Ver', total_label: 'TOTAL',
        out: 'Agotado', offer: 'Oferta', variants: 'variantes', enter_store: 'Entrar a la tienda', wa_hi: 'Hola, tengo una consulta sobre sus productos.',
        f_terminos: 'Términos y condiciones', f_privacidad: 'Política de privacidad',
        f_politicas: 'Políticas de compra', f_cookies: 'Política de cookies',
        f_contacto: 'Contacto', f_by: 'Plataforma de tienda de',
        closed_msg: 'La tienda está cerrada en este momento'
      },
      en: {
        nav_home: 'Home', nav_explore: 'Explore', nav_cart: 'Cart',
        buscar: 'Search items...',
        promo_title: 'New Year Sale', promo_discount: '25% off', promo_img: 'Promo image',
        categories_title: 'Categories', popular_title: 'Popular Products',
        cart_title: 'Cart', cart_total: 'Total', cart_checkout: 'Proceed to checkout',
        checkout_title: 'Shipping and payment details', co_name: 'Full name', co_name_ph: 'Your name',
        co_phone: 'Phone / WhatsApp', co_payment: 'Payment method', co_payment_sel: 'Select...',
        pay_cash: 'Cash', pay_transfer: 'Bank transfer', pay_mobile: 'Mobile payment', pay_card: 'Card',
        co_note: 'Note / reference (optional)', co_note_ph: 'Address, reference, size...',
        send_whatsapp: 'Send order via WhatsApp',
        cart_empty: 'Your cart is empty', no_products: 'No products', write_name: 'Enter your name',
        add_to_cart: 'Add to cart', view: 'View', total_label: 'TOTAL',
        out: 'Out of stock', offer: 'Sale', variants: 'variants', enter_store: 'Enter the store', wa_hi: 'Hello, I have a question about your products.',
        f_terminos: 'Terms and conditions', f_privacidad: 'Privacy policy',
        f_politicas: 'Purchase policies', f_cookies: 'Cookie policy',
        f_contacto: 'Contact', f_by: 'Store platform by',
        closed_msg: 'The store is currently closed'
      }
    };

    var lang = localStorage.getItem('whatshop_lang') === 'en' ? 'en' : 'es';
    function t(key) {
      var dict = I18N[lang], parts = key.split('.'), v = dict;
      for (var i = 0; i < parts.length; i++) v = v && v[parts[i]];
      return v != null ? v : key;
    }
    function applyLang() {
      document.documentElement.setAttribute('lang', lang);
      document.getElementById('lang-label').textContent = lang.toUpperCase();
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var val = t(el.getAttribute('data-i18n'));
        el.childNodes.forEach(function (n) { if (n.nodeType === 3) n.nodeValue = val; });
      });
      document.querySelectorAll('[data-i18n-ph]').forEach(function (el) {
        el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph')));
      });
      document.querySelectorAll('[data-i18n-aria]').forEach(function (el) {
        el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
      });
      renderCategories();
      renderProducts(currentFilter);
      renderExploreFilters();
      renderExplore();
    }

    // ===== Tema =====
    function applyThemeMode(mode) {
      document.documentElement.setAttribute('data-theme', mode);
      localStorage.setItem('whatshop_theme', mode);
      var sun = document.querySelector('.icon-sun'), moon = document.querySelector('.icon-moon');
      if (sun) sun.style.display = mode === 'dark' ? 'none' : '';
      if (moon) moon.style.display = mode === 'dark' ? '' : 'none';
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', mode === 'dark' ? '#171717' : '#FFFFFF');
      applyGradient();
    }
    function applyGradient() {
      var th = (settings && settings.theme) || {};
      var page = document.querySelector('.shop-page');
      if (!page) return;
      if (th.backgroundGradient === true && th.gradientColor) {
        var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#FFFFFF';
        var gcolor = th.gradientColor;
        if (document.documentElement.getAttribute('data-theme') === 'dark') gcolor = darken(gcolor, 0.6);
        page.style.background = 'linear-gradient(to bottom, ' + bg + ' 0%, ' + gcolor + ' 100%)';
      } else page.style.background = '';
    }
    function darken(hex, f) {
      var c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map(function (x) { return x + x; }).join('');
      return 'rgb(' + Math.round(parseInt(c.substring(0, 2), 16) * f) + ',' + Math.round(parseInt(c.substring(2, 4), 16) * f) + ',' + Math.round(parseInt(c.substring(4, 6), 16) * f) + ')';
    }
    applyThemeMode(localStorage.getItem('whatshop_theme') === 'dark' ? 'dark' : 'light');

    // ===== Splash fijo (3s) + pantalla de bienvenida =====
    var splashEl = document.getElementById('shop-splash');
    var welcomeShown = false;
    function showWelcome() {
      if (welcomeShown) return;
      welcomeShown = true;
      var w = document.getElementById('welcome-screen');
      if (!w) return;
      var sp = (settings && settings.splash) || {};
      w.style.background = sp.background || '#FFFFFF';
      var lg = document.getElementById('welcome-logo');
      var logoUrl = sp.logo || (settings.landing && settings.landing.logo) || './assets/logos/logoB.png';
      lg.style.opacity = '0';
      lg.onload = function () { lg.style.opacity = '1'; };
      lg.onerror = function () { lg.src = './assets/logos/logoB.png'; lg.style.opacity = '1'; };
      lg.src = logoUrl;
      var tx = document.getElementById('welcome-text');
      tx.textContent = sp.whatText || 'Bienvenido';
      tx.style.color = sp.whatColor || '#171717';
      w.classList.remove('hidden');
      w.classList.add('show');
    }
    function hideSplash() {
      if (!splashEl) return;
      splashEl.classList.add('fade-out');
      setTimeout(function () {
        splashEl.style.display = 'none';
        showWelcome();
      }, 600);
    }
    setTimeout(hideSplash, 3000);
    var welcomeBtn = document.getElementById('welcome-btn');
    if (welcomeBtn) {
      welcomeBtn.addEventListener('click', function (e) {
        var rect = welcomeBtn.getBoundingClientRect();
        var r = document.createElement('span');
        r.className = 'ripple';
        r.style.left = (e.clientX - rect.left) + 'px';
        r.style.top = (e.clientY - rect.top) + 'px';
        welcomeBtn.appendChild(r);
        setTimeout(function () { r.remove(); }, 600);
        var w = document.getElementById('welcome-screen');
        if (w) w.classList.add('hidden');
      });
    }

    // ===== Cargar tienda =====
    var settings = { store: {} };
    var currentFilter = '';
    var storeProducts = [];   // productos reales: {p, catId}
    (async function loadConfig() {
      try {
        var store = await SBStore();
        settings = store.settings || settings;
        window.__settings = settings;
        window.__store = store;
        applyTheme(settings);
        applyGradient();
        var s = settings.store || {};
        var name = s.name || 'WhatShop';
        var logo = (settings.landing && settings.landing.logo) || './assets/logos/logoB.png';
        document.getElementById('brand-name').textContent = name;
        var brandLogo = document.getElementById('brand-logo');
        brandLogo.style.opacity = '0';
        brandLogo.onload = function () { brandLogo.style.opacity = '1'; };
        brandLogo.onerror = function () { brandLogo.src = './assets/logos/logoB.png'; brandLogo.style.opacity = '1'; };
        brandLogo.src = logo;
        brandLogo.style.display = s.brandShowLogo === false ? 'none' : '';
        document.getElementById('brand-name').style.display = s.brandShowName === false ? 'none' : '';
        document.title = name;
        document.getElementById('footer-brand-name').textContent = name;
        document.getElementById('footer-year').textContent = new Date().getFullYear();

        var notice = document.getElementById('store-notice');
        if (s.open === false) {
          notice.textContent = s.closedMessage || t('closed_msg');
          notice.classList.add('closed'); notice.classList.remove('hidden');
        } else notice.classList.add('hidden');

        var paySel = document.getElementById('co-payment');
        if (paySel) {
          var methods = Array.isArray(s.paymentMethods) && s.paymentMethods.length ? s.paymentMethods : [t('pay_cash'), t('pay_transfer'), t('pay_mobile'), t('pay_card')];
          paySel.innerHTML = '<option value="" data-i18n="co_payment_sel">' + t('co_payment_sel') + '</option>';
          methods.forEach(function (m) {
            var opt = document.createElement('option'); opt.textContent = m; paySel.appendChild(opt);
          });
        }

        if (settings.landing && settings.landing.bannerTitle) {
          var el = document.querySelector('[data-i18n="promo_title"]'); if (el) el.textContent = settings.landing.bannerTitle;
        }
        if (settings.landing && settings.landing.bannerDiscount) {
          var el2 = document.querySelector('[data-i18n="promo_discount"]'); if (el2) el2.textContent = settings.landing.bannerDiscount;
        }

        storeProducts = [];
        (store.categories || []).forEach(function (c) { (c.products || []).forEach(function (p) { storeProducts.push({ p: p, catId: c.id, catName: c.name }); }); });
        (store.uncategorized || []).forEach(function (p) { storeProducts.push({ p: p, catId: null, catName: '' }); });
        CART.pruneCart(storeProducts.map(function (x) { return x.p.id; }));
        renderCategories();
        renderProducts(currentFilter);
        renderExploreFilters();
        renderExplore();
        CART.updateBadge();
      } catch (e) { console.warn('No se pudo cargar config', e); }
    })();

    function fmt(v) { return typeof window.formatPrice === 'function' ? window.formatPrice(v, settings) : String(Number(v || 0).toFixed(2)); }
    function prodImages(p) {
      if (Array.isArray(p.images) && p.images.length) return p.images;
      return p.image ? [p.image] : [];
    }
    function prodStock(p) {
      var vs = (p.product_variants || []).filter(function (v) { return v.color && v.size; });
      if (vs.length) return vs.reduce(function (s, v) { return s + (Number(v.stock) || 0); }, 0);
      return Number(p.stock) || 0;
    }
    function hasVariants(p) { return (p.product_variants || []).some(function (v) { return v.color || v.size; }); }

    function renderCategories() {
      var row = document.getElementById('category-row');
      var storeCats = window.__store && window.__store.categories;
      var cats = (storeCats && storeCats.length) ? storeCats : [];
      if (!cats.length) { row.innerHTML = ''; return; }
      row.innerHTML = cats.map(function (c) {
        var img = c.image ? '<img class="cat-img" src="' + c.image + '" alt="' + c.name + '" loading="lazy" />' : '<div class="placeholder-box cat-img" style="background:' + (c.color || '#E8ECF0') + '"></div>';
        return '<div class="category-card" data-cat="' + c.id + '" role="button" tabindex="0">' + img + '<div class="cat-label">' + c.name + '</div></div>';
      }).join('');
      row.querySelectorAll('[data-cat]').forEach(function (card) {
        function go() { activeExploreCat = String(card.getAttribute('data-cat')); showView('explore'); renderExploreFilters(); renderExplore(); }
        card.addEventListener('click', go);
        card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
      });
    }

    // ===== Render productos (tarjetas -> pagina de producto) =====
    function renderProducts(filter) {
      currentFilter = filter || '';
      var grid = document.getElementById('products-grid');
      var list = storeProducts;
      if (currentFilter) {
        var f = currentFilter.toLowerCase();
        list = list.filter(function (x) {
          var p = x.p;
          return (p.name || '').toLowerCase().indexOf(f) > -1 ||
                 (p.description || '').toLowerCase().indexOf(f) > -1 ||
                 (x.catName || '').toLowerCase().indexOf(f) > -1;
        });
      }
      if (!list.length) { grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--secondary-text)">' + t('no_products') + '</p>'; return; }
      grid.innerHTML = list.map(function (x) { return cardHtml(x); }).join('');
      wireCards(grid);
    }

    function cardHtml(x) {
      var p = x.p;
      var imgs = prodImages(p);
      var img = imgs[0] ? '<img class="prod-img" src="' + imgs[0] + '" alt="' + p.name + '" loading="lazy" />' : '<div class="placeholder-box prod-img" role="img" aria-label="' + p.name + '"></div>';
      var orig = p.original_price ? '<span class="prod-orig">' + fmt(p.original_price) + '</span>' : '';
      var offer = p.original_price ? '<span class="prod-offer-badge">' + t('offer') + '</span>' : '';
      var stock = prodStock(p);
      var stockTag = stock <= 0 ? '<span class="prod-stock out">' + t('out') + '</span>' : (hasVariants(p) ? '<span class="prod-stock">' + (p.product_variants || []).filter(function (v) { return v.color && v.size; }).length + ' ' + t('variants') + '</span>' : '');
      var btn = hasVariants(p)
        ? '<button class="add-btn" data-go="' + p.id + '">' + t('view') + '</button>'
        : '<button class="add-btn" data-add="' + p.id + '">' + t('add_to_cart') + '</button>';
      return '<article class="product-card" data-open="' + p.id + '" style="cursor:pointer">' +
        img + offer +
        '<div class="prod-body">' +
          '<div class="prod-title">' + p.name + '</div>' +
          '<div class="prod-price-row"><span class="prod-price">' + fmt(p.price) + '</span>' + orig + '</div>' +
          (stockTag ? '<div class="prod-stock-row">' + stockTag + '</div>' : '') +
          btn +
        '</div></article>';
    }

    function wireCards(grid) {
      grid.querySelectorAll('[data-open]').forEach(function (card) {
        card.addEventListener('click', function (e) {
          if (e.target.closest('[data-add]') || e.target.closest('[data-go]')) return;
          window.location.href = './product.html?id=' + card.getAttribute('data-open');
        });
      });
      grid.querySelectorAll('[data-go]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          window.location.href = './product.html?id=' + btn.getAttribute('data-go');
        });
      });
      grid.querySelectorAll('[data-add]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var id = Number(btn.getAttribute('data-add'));
          var x = storeProducts.find(function (it) { return it.p.id === id; });
          if (!x) return;
          var imgs = prodImages(x.p);
          CART.addItem({ id: x.p.id, title: x.p.name, price: Number(x.p.price) || 0, image: imgs[0] || null }, { qty: 1 });
        });
      });
    }

    // ===== Explorar =====
    var activeExploreCat = 'all';
    function renderExploreFilters() {
      var box = document.getElementById('explore-filters');
      var cats = (window.__store && window.__store.categories) || [];
      var chips = [{ id: 'all', name: t('nav_explore') }].concat(cats.map(function (c) { return { id: String(c.id), name: c.name }; }));
      box.innerHTML = chips.map(function (c) {
        return '<button class="filter-chip' + (activeExploreCat === c.id ? ' active' : '') + '" data-cat="' + c.id + '">' + c.name + '</button>';
      }).join('');
      box.querySelectorAll('[data-cat]').forEach(function (chip) {
        chip.addEventListener('click', function () {
          activeExploreCat = chip.getAttribute('data-cat');
          renderExploreFilters(); renderExplore();
        });
      });
    }
    function renderExplore() {
      var grid = document.getElementById('explore-grid');
      var list = storeProducts;
      if (activeExploreCat !== 'all') list = list.filter(function (x) { return String(x.catId) === String(activeExploreCat); });
      if (!list.length) { grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--secondary-text)">' + t('no_products') + '</p>'; return; }
      grid.innerHTML = list.map(function (x) { return cardHtml(x); }).join('');
      wireCards(grid);
    }

    function showView(view) {
      var home = document.getElementById('home-view');
      var explore = document.getElementById('explore-view');
      var banner = document.querySelector('.promo-banner');
      if (view === 'explore') {
        if (home) home.classList.add('hidden');
        if (banner) banner.classList.add('hidden');
        if (explore) { explore.classList.remove('hidden'); renderExplore(); }
      } else {
        if (home) home.classList.remove('hidden');
        if (banner) banner.classList.remove('hidden');
        if (explore) explore.classList.add('hidden');
      }
    }

    // ===== Init =====
    applyLang();
    CART.wire();
    CART.updateBadge();

    document.getElementById('search-input').addEventListener('input', function (e) { renderProducts(e.target.value); });
    document.getElementById('lang-toggle').addEventListener('click', function () {
      lang = lang === 'es' ? 'en' : 'es';
      localStorage.setItem('whatshop_lang', lang);
      applyLang();
    });
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var cur = document.documentElement.getAttribute('data-theme');
      applyThemeMode(cur === 'dark' ? 'light' : 'dark');
    });

    var allNav = document.querySelectorAll('.nav-item');
    allNav.forEach(function (item) {
      item.addEventListener('click', function () {
        var tab = item.getAttribute('data-tab');
        if (tab === 'cart') { CART.openCart(); return; }
        allNav.forEach(function (i) { i.classList.remove('active'); i.removeAttribute('aria-current'); });
        item.classList.add('active');
        item.setAttribute('aria-current', 'page');
        if (tab === 'explore') showView('explore');
        else if (tab === 'home') showView('home');
      });
    });

    function on(id, ev, fn) { var el = document.getElementById(id); if (el) el.addEventListener(ev, fn); }
    on('cart-open', 'click', CART.openCart);
  </script>
</body>
</html>
