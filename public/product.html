<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Producto - WhatShop</title>
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" type="image/png" href="./assets/logos/logoB.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/theme.css?v=21" />
  <link rel="stylesheet" href="./css/tienda.css?v=21" />
  <style>
    .product-page { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
    .p-back { display: inline-flex; align-items: center; gap: 6px; color: var(--secondary-text); background: none; border: none; font-size: .9rem; cursor: pointer; padding: 6px 10px; border-radius: 8px; margin-bottom: 16px; }
    .p-back:hover { background: var(--color-muted); }
    .p-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
    @media (max-width: 768px) { .p-layout { grid-template-columns: 1fr; gap: 20px; } }
    .p-gallery .main { position: relative; border-radius: 16px; overflow: hidden; background: var(--color-muted); aspect-ratio: 1/1; }
    .p-gallery .main img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .p-badge-offer { position: absolute; top: 12px; left: 12px; background: var(--color-accent); color: #fff; font-size: .72rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
    .p-thumbs { display: flex; gap: 10px; margin-top: 12px; overflow-x: auto; }
    .p-thumbs img { width: 70px; height: 70px; border-radius: 10px; object-fit: cover; cursor: pointer; border: 2px solid transparent; }
    .p-thumbs img.active { border-color: var(--color-primary); }
    .p-info h1 { font-size: 1.6rem; margin: 0 0 8px; }
    .p-cat { color: var(--secondary-text); font-size: .85rem; margin-bottom: 10px; }
    .p-price { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
    .p-price .now { font-size: 1.6rem; font-weight: 800; }
    .p-price .was { color: var(--secondary-text); text-decoration: line-through; font-size: 1.05rem; }
    .p-desc { color: var(--secondary-text); line-height: 1.55; margin-bottom: 20px; }
    .p-section { margin-bottom: 18px; }
    .p-section h4 { margin: 0 0 10px; font-size: .9rem; }
    .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
    .swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--color-border); cursor: pointer; }
    .swatch.active { border-color: var(--color-primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-primary) 15%, transparent); }
    .sizes { display: flex; gap: 8px; flex-wrap: wrap; }
    .size-pill { min-width: 44px; height: 42px; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--color-border); background: var(--color-background); font-weight: 600; font-size: .88rem; cursor: pointer; }
    .size-pill.active { border-color: var(--color-primary); background: var(--color-primary); color: var(--color-on-primary); }
    .size-pill.soldout { opacity: .4; text-decoration: line-through; cursor: not-allowed; }
    .p-qty { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .p-qty button { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--color-border); background: var(--color-background); font-size: 1.1rem; cursor: pointer; }
    .p-qty span { font-weight: 700; min-width: 28px; text-align: center; }
    .p-stock { font-size: .82rem; color: var(--secondary-text); margin-bottom: 6px; }
    .p-stock.out { color: var(--color-destructive); font-weight: 600; }
    .p-cta { display: flex; gap: 12px; flex-wrap: wrap; }
    .p-cta .add { background: var(--color-primary); color: var(--color-on-primary); border: none; border-radius: var(--radius); padding: 14px 20px; font-weight: 700; cursor: pointer; flex: 1; min-width: 160px; }
    .p-cta .add:disabled { opacity: .5; cursor: not-allowed; }
    .shop-page { padding-bottom: 84px; }
    .p-desc-box { margin-bottom: 6px; }
    .p-desc-box summary { cursor: pointer; font-weight: 600; font-size: .85rem; color: var(--secondary-text); padding: 4px 0; }
    .p-desc { color: var(--secondary-text); line-height: 1.55; font-size: .88rem; padding-top: 6px; }

    /* Barra inferior fija (talla + cantidad + precio + checkout) */
    .p-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 700;
      background: var(--color-background, #fff);
      border-top: 1px solid var(--color-border, #e5e5e5);
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
      display: flex; align-items: center; gap: 10px;
    }
    [data-theme="dark"] .p-bar { background: #171717; }
    .p-bar-left { flex: 1; min-width: 0; }
    .p-bar-sel { font-size: .8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-bar-price { font-size: 1.15rem; font-weight: 800; }
    .p-bar-qty { display: flex; align-items: center; gap: 6px; border: 1px solid var(--color-border); border-radius: 10px; padding: 2px 4px; flex-shrink: 0; }
    .p-bar-qty button { width: 30px; height: 30px; border: none; background: none; border-radius: 8px; font-size: 1.05rem; cursor: pointer; }
    .p-bar-qty button:hover { background: var(--color-muted); }
    .p-bar-qty span { min-width: 22px; text-align: center; font-weight: 700; }
    .p-bar-add, .p-bar-buy { min-height: 42px; border: none; border-radius: 12px; padding: 0 16px; font-weight: 700; font-size: .88rem; cursor: pointer; flex-shrink: 0; }
    .p-bar-add { background: var(--color-primary); color: var(--color-on-primary); }
    .p-bar-add:disabled { opacity: .5; cursor: not-allowed; }
    .p-bar-buy { background: var(--color-success, #16a34a); color: #fff; }

    @media (max-width: 480px) {
      .p-bar { gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); }
      .p-bar-sel { font-size: .72rem; }
      .p-bar-price { font-size: 1rem; }
      .p-bar-add, .p-bar-buy { padding: 0 12px; font-size: .82rem; min-height: 40px; }
      .p-bar-qty button { width: 26px; height: 26px; }
      .product-page { padding: 10px 12px 0; }
      .p-gallery .main { max-height: 40vh; }
      .p-thumbs img { width: 54px; height: 54px; }
      .p-info h1 { font-size: 1.2rem; }
      .p-price .now { font-size: 1.3rem; }
    }
  </style>
</head>
<body class="shop-page">

  <header class="top-header">
    <div class="top-header-inner">
      <div class="brand">
        <img id="brand-logo" src="./assets/logos/logoB.png" alt="Logo" />
        <h1 id="brand-name">WhatShop</h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="lang-toggle" title="Idioma"><span id="lang-label" style="font-weight:700;font-size:.9rem">ES</span></button>
        <button class="icon-btn" id="theme-toggle" title="Tema">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <button class="icon-btn" id="cart-open" title="Carrito" style="position:relative">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span id="cart-badge" class="cart-badge hidden">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="product-page">
    <button class="p-back" id="btn-back">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      <span data-i18n="back">Volver a la tienda</span>
    </button>

    <div id="p-loading" style="text-align:center;padding:60px 0;color:var(--secondary-text)" data-i18n="loading">Cargando…</div>

    <div class="p-layout hidden" id="p-content">
      <div class="p-gallery">
        <div class="main">
          <img id="p-hero" src="" alt="" />
          <span class="p-badge-offer hidden" id="p-offer-badge" data-i18n="offer">Oferta</span>
        </div>
        <div class="p-thumbs" id="p-thumbs"></div>
      </div>

      <div class="p-info">
        <div class="p-cat" id="p-cat"></div>
        <h1 id="p-name"></h1>
        <div class="p-price">
          <span class="now" id="p-price"></span>
          <span class="was hidden" id="p-was"></span>
        </div>
        <div class="p-desc" id="p-desc"></div>

        <div class="p-section" id="p-colors-sec">
          <h4 data-i18n="color">Color</h4>
          <div class="swatches" id="p-colors"></div>
        </div>

        <div class="p-section" id="p-sizes-sec">
          <h4 data-i18n="size">Talla</h4>
          <div class="sizes" id="p-sizes"></div>
        </div>

        <div class="p-stock" id="p-stock"></div>

        <details class="p-desc-box">
          <summary data-i18n="desc_title">Descripción</summary>
          <div class="p-desc" id="p-desc"></div>
        </details>
      </div>
    </div>
  </main>

  <div class="p-bar hidden" id="p-bar">
    <div class="p-bar-left">
      <div class="p-bar-sel" id="p-bar-sel">Elige color y talla</div>
      <div class="p-bar-price" id="p-bar-price">$0.00</div>
    </div>
    <div class="p-bar-qty">
      <button id="qty-dec" aria-label="-">&minus;</button>
      <span id="qty-val">1</span>
      <button id="qty-inc" aria-label="+">+</button>
    </div>
    <button class="p-bar-add" id="btn-add-cart" data-i18n="bar_add">Agregar</button>
    <button class="p-bar-buy" id="btn-buy" data-i18n="bar_buy">Comprar</button>
  </div>

  <div class="cart-scrim" id="cart-scrim"></div>
  <aside class="cart-drawer" id="cart-drawer">
    <div class="cart-head">
      <h3 data-i18n="cart">Carrito</h3>
      <button class="cart-close" id="cart-close" aria-label="Cerrar">&times;</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-foot">
      <div class="cart-total-row"><span data-i18n="total">Total</span><span class="amount" id="cart-total">$0.00</span></div>
      <button class="btn-checkout" id="go-checkout" data-i18n="checkout">Proceder al checkout</button>
    </div>
  </aside>

  <footer class="shop-footer">
    <div class="footer-inner">
      <div class="footer-brand"><img src="./assets/logos/logoB.png" alt="Logo WhatShop" /><span><span class="what">What</span><span class="shop">Shop</span></span></div>
      <div class="footer-links"><a href="./tienda.html" data-i18n="back_shop">Volver a la tienda</a></div>
      <div class="footer-copy"><span>&copy; <span id="footer-year"></span> WhatShop</span></div>
    </div>
  </footer>

  <div class="toast" id="toast" role="status"></div>

  <script src="./config.js?v=21"></script>
  <script src="./js/supabase.js?v=21"></script>
  <script src="./js/cart.js?v=21"></script>
  <script src="./js/product.js?v=21"></script>
</body>
</html>
